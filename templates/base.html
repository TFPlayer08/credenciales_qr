<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Credenciales{% endblock %} · {{ INSTITUCION }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% if session.uid %}
<header class="topbar no-print">
  <a class="brand" href="{{ url_for('index') }}">🪪 {{ INSTITUCION }}</a>
  <button class="burger" id="burger" aria-label="Menú">☰</button>
  <nav id="nav">
    <a href="{{ url_for('index') }}">Trabajadores</a>
    <a href="{{ url_for('nuevo') }}">Nuevo</a>
    <a href="{{ url_for('imprimir') }}">Imprimir todas</a>
    <a href="{{ url_for('logout') }}">Salir</a>
  </nav>
</header>
{% endif %}
<main class="container">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }} no-print">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
